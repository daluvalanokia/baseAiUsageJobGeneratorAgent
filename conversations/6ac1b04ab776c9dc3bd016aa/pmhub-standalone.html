t applied to staging DB","SQL Server migration script applied to staging DB","DB_PROVIDER env var confirmed on all target environments","Rollback scripts tested (tables drop cleanly)","Smoke test passed on staging","Release notes drafted","PM + QA Manager sign-off",...o]}const Ye=[{number:1,theme:"Project Bootstrap",quarter:"Q1 – Foundation & Auth",squads:["H","A"],points:18,stories:[{id:"CLF-001",title:"CI/CD Pipeline",role:"DevOps engineer",want:"every PR to trigger automated build and test",benefit:"regressions are caught before merge",ac:["GitHub Actions workflow runs on PR open","dotnet build + dotnet test pass for .NET 8","Test results published as PR check","Docker image built on merge to main"],points:5,squad:"H",priority:"Must"},{id:"CLF-002",title:"DB Schema Baseline",role:"DBA",want:"all 11 domain tables created in Oracle and SQL Server",benefit:"developers can begin data-layer work immediately",ac:["Oracle DDL runs clean on Oracle 19c","SQL Server DDL runs clean on SQL Server 2019","EF Core migration class generated","Indexes on userid, username, user_id, recorded_at applied"],points:3,squad:"H",priority:"Must"},{id:"CLF-003",title:"ASP.NET Core Skeleton",role:"developer",want:"a configured ASP.NET Core 8 MVC project",benefit:"routing, DI, middleware and DB provider switching are in place",ac:["/health returns 200 in < 200ms","DB_PROVIDER env var switches oracle/sqlserver providers","All 11 DbSets resolve without error","appsettings.Development.json and appsettings.json present"],points:5,squad:"A",priority:"Must"},{id:"CLF-004",title:"Login Skeleton",role:"admin",want:"a login page",benefit:"I can authenticate and access the platform",ac:["GET /Account/Login renders view","POST validates credentials against DB","Cookie issued on success","Invalid credentials return error message on view"],points:3,squad:"A",priority:"Must"},{id:"CLF-005",title:"Health Endpoint",role:"implementation team",want:"a /health endpoint",benefit:"load balancers can probe application liveness",ac:["200 OK with { status: 'healthy' } when DB connected","503 with { status: 'unhealthy' } when DB unreachable","Response time < 200ms under normal load","Works for both Oracle and SQL Server providers"],points:2,squad:"H",priority:"Must"}],unitTests:[{id:"UT-S01-001",cls:"GeofenceService",method:"IsInsideGeofence",scenario:"User 0.5mi from home, radius 1mi",expected:"returns true"},{id:"UT-S01-002",cls:"GeofenceService",method:"IsInsideGeofence",scenario:"User 2.0mi from home, radius 1mi",expected:"returns false"},{id:"UT-S01-003",cls:"GeofenceService",method:"HaversineDistanceMiles",scenario:"NYC to LAX coordinates",expected:"2451 ± 5 miles"},{id:"UT-S01-004",cls:"AuthService",method:"HashPassword",scenario:"plaintext 'test123'",expected:"non-empty BCrypt hash ≠ input"},{id:"UT-S01-005",cls:"AuthService",method:"ValidatePassword",scenario:"correct password vs stored hash",expected:"returns true"},{id:"UT-S01-006",cls:"AuthService",method:"ValidatePassword",scenario:"wrong password vs stored hash",expected:"returns false"},{id:"UT-S01-007",cls:"ClaftDbContext",method:"ModelCreating",scenario:"Oracle provider active",expected:"no exception, 11 DbSets registered"},{id:"UT-S01-008",cls:"ClaftDbContext",method:"ModelCreating",scenario:"SQL Server provider active",expected:"no exception, 11 DbSets registered"},{id:"UT-S01-009",cls:"ClusterConnectionService",method:"GetClusterDb",scenario:"valid cluster ID passed",expected:"returns non-null DbContext"},{id:"UT-S01-010",cls:"ClusterConnectionService",method:"Invalidate",scenario:"known cluster ID passed",expected:"cache entry removed, next call opens fresh connection"}],systemTests:[{id:"ST-S01-001",feature:"Health – Oracle",precondition:"Oracle DB running, valid connection string",steps:"GET /health",expected:"200 { status:'healthy', db:'connected' }",env:"staging"},{id:"ST-S01-002",feature:"Health – SQL Server",precondition:"SQL Server running",steps:"GET /health",expected:"200 { status:'healthy' }",env CREATE TABLE claft_users (
  id              NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  userid          VARCHAR2(50)   NOT NULL,
  username        VARCHAR2(100)  NOT NULL,
  password_hash   VARCHAR2(255)  NOT NULL,
  role            VARCHAR2(20)   DEFAULT 'user' NOT NULL,
  firstname       VARCHAR2(100)  NOT NULL,
  lastname        VARCHAR2(100)  NOT NULL,
  address1        VARCHAR2(255),  city VARCHAR2(100),
  state           VARCHAR2(50),   zipcode VARCHAR2(20),
  phone           VARCHAR2(30),   email VARCHAR2(255),
  gender          VARCHAR2(20),   dob DATE,
  family_type     VARCHAR2(20),
  home_lat        NUMBER(10,7),   home_lng NUMBER(10,7),
  device_name     VARCHAR2(100),  meid VARCHAR2(100),
  is_active       NUMBER(1)      DEFAULT 1 NOT NULL,
  out_of_geofence_count NUMBER(6) DEFAULT 0 NOT NULL,
  created_at      TIMESTAMP      DEFAULT SYSTIMESTAMP NOT NULL,
  updated_at      TIMESTAMP      DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT uq_claft_userid   UNIQUE (userid),
  CONSTRAINT uq_claft_username UNIQUE (username)
);
CREATE INDEX idx_users_lastname  ON claft_users(lastname);
CREATE INDEX idx_users_is_active ON claft_users(is_active);

CREATE TABLE claft_clusters (
  id                     NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  instance_name          VARCHAR2(200) NOT NULL,
  database_url           VARCHAR2(500) NOT NULL,
  geofence_radius_miles  NUMBER(6,2)   DEFAULT 1.00 NOT NULL,
  tracking_interval_hours NUMBER(4,1)  DEFAULT 1.0  NOT NULL,
  data_purge_days        NUMBER(6)     DEFAULT 90   NOT NULL,
  notes CLOB, is_active NUMBER(1) DEFAULT 1 NOT NULL,
  created_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  updated_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL
);

CREATE TABLE claft_app_config (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  instance_name VARCHAR2(200) DEFAULT 'Claft' NOT NULL,
  geofence_radius_miles NUMBER(6,2) DEFAULT 1.00 NOT NULL,
  tracking_interval_hours NUMBER(4,1) DEFAULT 1.0 NOT NULL,
  data_purge_days NUMBER(6) DEFAULT 90 NOT NULL,
  created_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  updated_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL
);

CREATE TABLE claft_location_history (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id NUMBER NOT NULL,
  lat NUMBER(10,7) NOT NULL, lng NUMBER(10,7) NOT NULL,
  location_name VARCHAR2(255),
  is_inside_geofence NUMBER(1) DEFAULT 1 NOT NULL,
  accuracy NUMBER(8,2), battery_level NUMBER(3),
  recorded_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT fk_loc_user FOREIGN KEY (user_id)
    REFERENCES claft_users(id) ON DELETE CASCADE
);
CREATE INDEX idx_loc_user_id  ON claft_location_history(user_id);
CREATE INDEX idx_loc_recorded ON claft_location_history(recorded_at);

CREATE TABLE claft_chat_messages (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  sender_id NUMBER NOT NULL, receiver_id NUMBER NOT NULL,
  content CLOB NOT NULL, is_read NUMBER(1) DEFAULT 0 NOT NULL,
  created_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT fk_chat_sender   FOREIGN KEY (sender_id)   REFERENCES claft_users(id) ON DELETE CASCADE,
  CONSTRAINT fk_chat_receiver FOREIGN KEY (receiver_id) REFERENCES claft_users(id) ON DELETE CASCADE
);
CREATE INDEX idx_chat_sender   ON claft_chat_messages(sender_id);
CREATE INDEX idx_chat_receiver ON claft_chat_messages(receiver_id);

CREATE TABLE claft_visiting_locations (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id NUMBER NOT NULL, name VARCHAR2(255) NOT NULL,
  lat NUMBER(10,7) NOT NULL, lng NUMBER(10,7) NOT NULL,
  status VARCHAR2(20) DEFAULT 'planned' NOT NULL,
  notes CLOB, visited_at TIMESTAMP,
  created_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT fk_vl_user FOREIGN KEY (user_id) REFERENCES claft_users(id) ON DELETE CASCADE
);

CREATE TABLE claft_call_sessions (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  caller_id NUMBER NOT NULL, callee_id NUMBER NOT NULL,
  status VARCHAR2(20) NOT NULL,
  started_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL, ended_at TIMESTAMP,
  CONSTRAINT fk_call_caller FOREIGN KEY (caller_id) REFERENCES claft_users(id) ON DELETE CASCADE,
  CONSTRAINT fk_call_callee FOREIGN KEY (callee_id) REFERENCES claft_users(id) ON DELETE CASCADE
);

CREATE TABLE claft_calendar_events (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id NUMBER NOT NULL, title VARCHAR2(255) NOT NULL,
  description CLOB, event_date DATE NOT NULL,
  is_all_day NUMBER(1) DEFAULT 1 NOT NULL,
  created_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT fk_cal_user FOREIGN KEY (user_id) REFERENCES claft_users(id) ON DELETE CASCADE
);

CREATE TABLE claft_devices (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id NUMBER NOT NULL, device_name VARCHAR2(100) NOT NULL,
  meid VARCHAR2(100), platform VARCHAR2(50),
  registered_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT fk_dev_user FOREIGN KEY (user_id) REFERENCES claft_users(id) ON DELETE CASCADE
);

CREATE TABLE claft_frequent_locations (
  id NUMBER GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
  user_id NUMBER NOT NULL, name VARCHAR2(255) NOT NULL,
  lat NUMBER(10,7) NOT NULL, lng NUMBER(10,7) NOT NULL,
  visit_count NUMBER(6) DEFAULT 1 NOT NULL,
  last_visited TIMESTAMP, created_at TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,
  CONSTRAINT fk_fl_user FOREIGN KEY (user_id) REFERENCES claft_users(id) ON DELETE CASCADE
);

CREATE TABLE claft_phone_outage_records (

e","All tests run green on both Oracle and SQL Server CI pipelines"],["docker build produces image < 400 MB; docker-compose up completes in < 60s","DB migration runs automatically on container start (EF Core pending check)"],["Staging deployment passes smoke tests: login, create user, create cluster, health check","No P1/P2 defects open at RC sign-off"]],"Location Ingestion":[["POST /api/locations stores lat/lng/recorded_at; Haversine distance from home_lat/home_lng computed","is_inside_geofence set correctly for radius within 0.1 km tolerance"],["battery_level (0–100) and accuracy stored when provided; null allowed","POST with null lat or null lng returns 400 {field:'lat', error:'required'}"],["out_of_geofence_count incremented atomically when is_inside_geofence=false","Counter never decremented on re-entry (audit trail preserved)"],["Missing lat/lng returns 400; lat outside ±90 or lng outside ±180 returns 422","Unauthenticated request returns 401"]],"Live Locations API":[["GET /api/locations/current returns latest record per active family member within scope","Response shape: [{userId, lat, lng, recordedAt, isInsideGeofence, batteryLevel}]"],["Response joined with claft_users: username, firstname, lastname included for map pin labels","Inactive users (is_active=0) excluded from response"]],"Location History":[["GET /api/locations/history?userId=&from=&to= returns records in date range, newest first","from/to default to last 24h if omitted; max range 90 days (data_purge_days cap)"],["Records older than data_purge_days excluded from response (soft boundary)","user scope: own records only; admin scope: full family; 403 on cross-user access"],["Page size default 50, max 200; Link header contains next page URL"]],"Map View":[["GET /map renders Leaflet map with family member pins at latest GPS positions","Pin tooltip shows firstname, battery level icon (<20% red), geofence status badge"],["Geofence circle drawn at home_lat/home_lng with radius = geofence_radius_miles (converted to metres for Leaflet)","Circle colour: green when all members inside; amber when any member outside"],["Map auto-refreshes via JS polling every tracking_interval_hours × 3600 × 1000 ms","Refresh countdown timer visible; manual refresh button available"]],"Visiting Locations":[["POST /api/visiting-locations creates record with status='planned'; lat/lng required","Status machine: planned → active → completed; planned → cancelled (no other transitions)"],["PUT /api/visiting-locations/{id}/status validates transition; invalid transition returns 409","visited_at auto-set when status transitions to 'completed'"],["GET /api/visiting-locations returns list ordered by created_at DESC with status badge data"]],"Q2 Hardening":[["Q2 regression suite covers all location, map, and visiting-location endpoints; ≥ 80% line coverage","Suite runs in < 5 min on CI"],["Oracle and SQL Server DB scripts re-run on clean schema; idempotency verified for Sprint 1–12 migrations"]],"Dashboard Stats":[["GET /api/stats returns {totalUsers, activeUsers, locationsToday, alertsOutsideGeofence} in < 300ms","activeUsers = users with location record in last 24h"],["Dashboard widget displays stats with last-updated timestamp; auto-refresh every 60s via JS interval"]],"Family Members API":[["GET /api/family returns members scoped by role: self only (user), full family (admin)","Response includes last_known_location: {lat, lng, recordedAt, isInsideGeofence}"],["Member with no location records returns last_known_location: null (not omitted)","Inactive members excluded unless ?includeInactive=true and requester is admin"]],"Chat Messaging":[["POST /api/chat/messages stores sender_id (from auth cookie), receiver_id, content; returns 201 with message id","content blank returns 400; receiver_id not in family scope returns 403"],["GET /api/chat/messages?with={userId}&page=1 returns 20 messages newest-first, with unreadCount in header","Messages respect data_purge_days; old records excluded from response"],["PATCH /api/chat/messages/{id}/read sets is_read=1; only receiver may mark read (403 if sender calls)","Bulk mark-read: PATCH /api/chat/threads/{userId}/read-all sets all unread to read"],["Purge job deletes chat records older than data_purge_days on schedule; verified by rowcount before/after"]],"Call Sessions":[["POST /api/calls creates session with status='ringing', caller_id from auth, callee_id from body","Duplicate active session (caller already in call) returns 409"],["PUT /api/calls/{id}/answer sets status='active', answered_at=NOW(); only callee may answer (403 otherwise)","PUT /api/calls/{id}/end sets status='ended', ended_at=NOW(); either party may end"],["GET /api/calls/history returns last 20 sessions for authenticated user (as caller or callee), newest first"]],"Calendar Events":[["POST /api/calendar creates event with user_id from auth; title, event_date required; all_day defaults true","is_all_day=false requires start_time and end_time fields; end > start validated"],["GET /api/calendar?from=&to= returns events in date range for family scope; owner's events + shared events","Events returned sorted by event_date ASC, start_time ASC"],["PUT/DELETE /api/calendar/{id} restricted to owner (user_id = auth user); 403 for others","Deleted events removed hard (no soft delete for calendar)"]],"Frequent Locations":[["POST /api/frequent-locations creates named pin with lat/lng, visit_count=0","Duplicate name for same user_id returns 409 Conflict"],["GET /api/frequent-locations/suggest returns top 5 by visit_count DESC for authenticated user","Suggestion response excludes locations with visit_count=0"]],"Q3 Hardening":[["Q3 regression suite covers chat, calendar, call, frequent-location, family endpoints; ≥ 80% coverage"],["DB migration audit Sprint 7–18: scripts re-applied to blank Oracle and SQL Server schemas; no errors"]],"Device Tracking":[["POST /api/devices registers device with meid, device_name, platform for authenticated user","Duplicate meid for same user returns 409; different user returns 422 (MEID conflict)"],["GET /api/devices returns own devices for user; admin GET /admin/devices returns all with owner info"]],"Phone Outage Records":[["POST /api/outages logs event: type in {phone_charge, phone_silent, low_volume, connectivity_lost}","type outside enum returns 422 with allowed values list"],["GET /api/outages?type=&from=&to= returns filtered records; default last 7 days; max range data_purge_days"]],"Geofence Notifications":[["Geofence breach triggers notification INSERT within 500ms of location record with is_inside_geofence=0","Notification type='breach_exit'; re-entry notification type='breach_enter'"],["GET /api/clusters/{id}/notification-config returns enable_notifications, notification_email fields","PUT updates config; invalid email format returns 400"],["GET /api/notifications/history returns last 100 sent notifications for cluster; includes delivered_at"]],"Admin Dashboard":[["GET /admin/dashboard/stats returns {clusterCount, totalUsers, locationsToday, alertsThisWeek} aggregated across all clusters for superuser","Cluster-scoped admin sees own cluster stats only"],["GET /admin/dashboard/heatmap returns hourly location counts for last 7 days (168 data points)","Heatmap rendered as 7×24 grid in browser with colour gradient"]],"Data Export & Purge":[["GET /admin/export/locations?from=&to= streams CSV with columns: userId, lat, lng, recordedAt, isInsideGeofence; Content-Disposition: attachment","Empty result returns CSV header row only (not 404)"],["Purge job runs daily at 02:00 UTC; deletes records older than data_purge_days from location_history, chat_messages, notifications","Purge run logged to claft_audit_log with row counts; job idempotent"]],"Security Hardening":[["OWASP Top-10 audit findings for SQL injection, XSS, CSRF resolved; penetration test report signed off","All DB queries use parameterised statements (EF Core); no string-concatenated SQL"],["Third-party pen test scheduled and cri
